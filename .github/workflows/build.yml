name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - "maintenance/**"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-debug-build:
    name: Unsigned Debug build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project Pearcleaner.xcodeproj \
            -scheme "Pearcleaner Debug" \
            -configuration Debug \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
